  - id: "cards"
    specLocation: "json/cards_v2_swagger.json"
    headers:
      apiKey: "${MAMBU_AUTH_API_KEY}"
      Accept: "application/vnd.mambu.v2+json"
    operations:
      - label: "cards/create_authorization_hold"
        description: "Create an authorization hold corresponding to a given card."
        operationId: "createAuthorizationHold"
      - label: "cards/reverse_authorization_hold"
        description: "Reverse a card authorization hold."
        operationId: "reverseAuthorizationHold"
      - label: "cards/get_authorization_hold_by_id"
        description: "Get card authorization hold"
        operationId: "getAuthorizationHoldById"
      - label: "cards/patch_authorization_hold"
        description: "Partially update an authorization hold"
        operationId: "patchAuthorizationHold"
      - label: "cards/decrease_authorization_hold"
        description: "Decreases the amount of an authorization hold. If the amount is greater or equal to the authorization hold amount, then the authorization hold is reversed."
        operationId: "decreaseAuthorizationHold"
      - label: "cards/increase_authorization_hold"
        description: "Increase authorization hold amount"
        operationId: "increaseAuthorizationHold"
      - label: "cards/create_bulk_authorization_holds"
        description: "Create bulk authorization holds corresponding to a given card"
        operationId: "createBulkAuthorizationHolds"
      - label: "cards/get_account_balances"
        description: "Get account balances using card tokens"
        operationId: "getAccountBalances"
      - label: "cards/create_card_transaction"
        description: "Create a financial transaction corresponding to a given card"
        operationId: "createCardTransaction"
      - label: "cards/get_card_transaction"
        description: "Get card transaction"
        operationId: "getCardTransaction"
      - label: "cards/reverse_card_transaction"
        description: "Reverse card transaction"
        operationId: "reverseCardTransaction"
