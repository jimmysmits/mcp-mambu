        operationId: "getAll"
      - label: "clients/create"
        description: "Create client"
        operationId: "create"
      - label: "clients/delete"
        description: "Delete client"
        operationId: "delete"
      - label: "clients/get_by_id"
        description: "Get client"
        operationId: "getById"
        prompts:
          en:
            - "single client record by identifier"
            - "retrieve one customer's profile"
            - "fetch a client's full record"
            - "let me pull up this customer's complete record by their id"
          es:
            - "registro de un cliente por identificador"
            - "recuperar el perfil de un cliente"
            - "obtener el expediente completo del cliente"
      - label: "clients/patch"
