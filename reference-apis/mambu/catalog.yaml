baseUrl: "${MAMBU_BASE_URL}"

access:
  default: deny
  include:
    - "*/list"
    - "*/list_*"
    - "*/get"
    - "*/get_*"
    - "*/search_*"
    - "*/download_*"
    - "*/find_*"
  exclude:
    - "archive_*/*"
    - "database_backup/*"
    - "communications_messages/search_sorted"
    - "loans/get_preview_loan_account_schedule"
    # Admin migration tooling — present in the catalog (so it's indexed and
    # search-quality tuning can measure it) but denied at runtime so live
    # agents never see it. Note data_import/get_import would otherwise be
    # auto-allowed by the "*/get_*" include, so this explicit exclude is
    # required. Operators who need it can override via ACCESS_INCLUDE.
    - "data_import/*"
apis:
  - id: "accounting_interest_accrual"
    name: "Accounting – Interest Accrual"
    specLocation: "json/accounting_interestaccrual_v2_swagger.json"
    headers:
      apiKey: "${MAMBU_AUTH_API_KEY}"
      Accept: "application/vnd.mambu.v2+json"
    operations:
      - label: "accounting_interest_accrual/search"
        description: "Allows search of interest accrual breakdown entries by various criteria."
        operationId: "search"
        type: "READ"
