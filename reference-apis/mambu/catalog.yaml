  - id: "branches"
    specLocation: "json/branches_v2_swagger.json"
    headers:
      apiKey: "${MAMBU_AUTH_API_KEY}"
      Accept: "application/vnd.mambu.v2+json"
    operations:
      - label: "branches/list"
        description: "Get branches"
        operationId: "getAll"
        prompts:
          en:
            - "branches"
            - "list branches"
            - "show branches"
            - "show every bank branch in the organization"
            - "which branches do we operate"
            - "branch directory"
            - "pull up the list of all branches in the organization"
          es:
            - "sucursales"
            - "listar sucursales"
            - "mostrar sucursales"
            - "mostrar todas las sucursales activas"
            - "lista de todas las sucursales"
            - "mostrar todas las sucursales de la organización"
            - "qué sucursales tenemos operando"
            - "directorio de sucursales"
      - label: "branches/create"
        description: "Create branch"
        operationId: "create"
      - label: "branches/get_by_id"
        description: "Get branch"
        operationId: "getById"
        prompts:
          en:
            - "details of a single branch by identifier"
            - "one branch's metadata and address"
            - "lookup a branch record"
            - "pull up the record for this specific branch by its identifier"
          es:
            - "detalles de una sucursal por identificador"
            - "metadatos y dirección de una sucursal"
            - "consultar registro de una sucursal"
            -
