        description: "Credit arrangements list returned."
        operationId: "getCreditArrangementsByClientIdOrKey"
        prompts:
          en:
            - "all credit arrangements tied to a specific client"
            - "everything under this client's credit umbrella"
            - "client's lending relationship summary"
            - "show me every lending relationship tied to this specific client"
          es:
            - "todos los acuerdos de crédito de un cliente específico"
            - "vinculación crediticia completa del cliente"
            - "resumen de la relación de crédito del cliente"
      - label: "clients/get_role_by_client_id"
        description: "Get client role for client"
        operationId: "getRoleByClientId"
        prompts:
          en:
            - "client role assigned to a customer"
            - "customer's designated role type"
            - "what role does this client hold"
            - "show me the role designation for this individual client"
          es:
            - "rol de cliente asignado a un cliente"
            - "tipo de rol designado del cliente"
            - "qué rol tiene asignado este cliente"
      - label: "clients/search"
        description: "Search clients"
        operationId: "search"
        prompts:
          en:
            - "find a customer by name or ID"
            - "find a customer by national ID number"
            - "find a client by their government ID number"
            - "look up client by document number"
            - "search clients by ID"
            - "look up a client record"
            - "search for a customer"
            - "let me look up a client record using search filters"
          es:
            - "buscar cliente por nombre o identificación"
            - "buscar cliente por número de documento"
            - "encontrar cliente por DNI"
            - "encontrar registro del cliente"
            - "localizar un cliente"
