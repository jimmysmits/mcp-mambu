      - label: "communications_messages/get_by_encoded_key"
        description: "Get communication message"
        operationId: "getByEncodedKey"
      - label: "communications_messages/resend"
        description: "Resend failed communication message(s)"
        operationId: "resend"
      - label: "communications_messages/enqueue_by_date"
        description: "Resend failed communication message(s) asynchronously by date"
        operationId: "enqueueByDate"
      - label: "communications_messages/enqueue_by_keys"
        description: "Resend failed communication message(s) asynchronously using keys"
        operationId: "enqueueByKeys"
      - label: "communications_messages/search"
        description: "Searching communication messages"
        operationId: "search"
        prompts:
          en:
            - "find messages sent to a client"
            - "communications history with customer"
            - "look up client notifications"
            - "show me the notification and messaging history for this client"
          es:
            - "mensajes enviados al cliente"
            - "buscar comunicaciones con el cliente"
            - "historial de notificaciones al cliente"
            - "registro de mensajes SMS, correos electrónicos y notificaciones enviadas desde el banco"
            - "búsqueda en el log de mensajes del sistema por fecha o estado de entrega"
            - "consultar el historial de mensajes enviados, filtrado por destinatario o canal"
      - label: "communications_messages/search_sorted"
        description: "Searching sorted communication messages"
        operationId: "search_1"
        prompts:
          en:
            - "search client messages with sort order"
            - "sorted message history"
            - "ordered communication log"
          es:
            - "buscar mensajes ordenados"
            - "historial de mensajes ordenado"
