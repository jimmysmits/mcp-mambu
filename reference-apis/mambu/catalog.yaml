      - label: "cards/increase_authorization_hold"
        description: "Increase authorization hold amount"
        operationId: "increaseAuthorizationHold"
        enabled: ${CARDS_INCREASE_AUTHORIZATION_HOLD:false}
      - label: "cards/create_bulk_authorization_holds"
        description: "Create bulk authorization holds corresponding to a given card"
        operationId: "createBulkAuthorizationHolds"
        enabled: ${CARDS_CREATE_BULK_AUTHORIZATION_HOLDS:false}
      - label: "cards/get_account_balances"
        description: "Get account balances using card tokens"
        operationId: "getAccountBalances"
        enabled: ${CARDS_GET_ACCOUNT_BALANCES:true}
      - label: "cards/create_card_transaction"
        description: "Create a financial transaction corresponding to a given card"
        operationId: "createCardTransaction"
        enabled: ${CARDS_CREATE_CARD_TRANSACTION:false}
      - label: "cards/get_card_transaction"
        description: "Get card transaction"
        operationId: "getCardTransaction"
        enabled: ${CARDS_GET_CARD_TRANSACTION:true}
      - label: "cards/reverse_card_transaction"
