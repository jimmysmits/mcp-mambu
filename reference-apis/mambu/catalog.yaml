baseUrl: "${MAMBU_BASE_URL}"

access:
  default: deny
  include:
    - "*/list"
    - "*/list_*"
    - "*/get"
    - "*/get_*"
    - "*/search_*"
    - "*/download_*"
    - "*/find_*"
  exclude:
    - "archive_*/*"
    - "database_backup/*"
    - "communications_messages/search_sorted"
    - "loans/get_preview_loan_account_schedule"
apis:
  - id: "accounting_interest_accrual"
    specLocation: "json/accounting_interestaccrual_v2_swagger.json"
    headers:
      apiKey: "${MAMBU_AUTH_API_KEY}"
      Accept: "application/vnd.mambu.v2+json"
    operations:
      - label: "accounting_interest_accrual/search"
        description: "Allows search of interest accrual breakdown entries by various criteria."
        operationId: "search"
