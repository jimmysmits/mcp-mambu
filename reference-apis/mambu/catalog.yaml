        operationId: "getAll"
        prompts:
          en:
            - "list operational centres under branches"
            - "sub-branch collection points"
            - "show all the centres"
            - "show me all the sub-branch collection centres"
          es:
            - "listar centros operativos bajo sucursales"
            - "puntos de cobranza de sucursal"
            - "mostrar todos los centros"
      - label: "centres/get_by_id"
        description: "Get centre"
        operationId: "getById"
        prompts:
          en:
            - "details of a single centre by identifier"
            - "one centre's record and parent branch"
            - "lookup a specific centre"
            - "show me the record for this particular centre and its parent branch"
          es:
            - "detalles de un centro por identificador"
            - "registro de un centro y su sucursal matriz"
            - "consultar un centro específico"
